[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-idf-tool"
version = "0.1.0"
description = "A multilingual text analysis tool using TF-IDF and cosine similarity"
readme = "README.md"
authors = [
    { name = "whaiman" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "nltk>=3.6.0",
    "pymorphy3>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tfidf*"]